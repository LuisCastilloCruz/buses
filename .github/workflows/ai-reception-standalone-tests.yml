name: AiReception isolated PHP checks

on:
  push:
    branches:
      - feature/ai-reception-foundation-20261120
      - feature/multifactura-aireception-odontologia-completo-v4
      - feature/multifactura-aireception-segura-v5
      - feature/multifactura-ai-reception-release-candidate-v6
      - feature/multifactura-ollama-universal-v7
      - feature/multifactura-ollama-coherence-v7-1
      - feature/ai-reception-agenda-v1
      - feature/multifactura-native-aireception-odontologia-v3
      - "integration/ai-reception-tattoo-20261120*"
    paths:
      - 'modules/AiReception/**'
      - 'gateway/**'
      - 'app/Auth/**'
      - 'app/Providers/AuthServiceProvider.php'
      - 'qa/performance/**'
      - 'qa/ai-reception-evaluation/**'
      - 'app/Exceptions/Handler.php'
      - 'database/migrations/tenant/2026_11_28_*'
      - 'database/migrations/tenant/2026_11_23_*'
      - 'database/migrations/2026_11_22_*'
      - 'database/migrations/tenant/2026_11_22_*'
      - 'demo-agenda/**'
      - 'native-lab/**'
      - 'modules/Odontologia/**'
      - 'modules/Tattoo/Services/**'
      - 'modules/TattooInbox/Services/Inbox*.php'
      - '.github/workflows/ai-reception-standalone-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-php:
    name: Standalone PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring
      - name: Check PHP syntax
        run: |
          find modules/AiReception/Agenda modules/AiReception/Native modules/Odontologia modules/Tattoo/Services native-lab demo-agenda -name '*.php' -print0 | xargs -0 -n1 php -l
          find database/migrations -name '2026_11_2[23]_*.php' -print0 | xargs -0 -n1 php -l
          php -l modules/AiReception/Services/SlotPlanner.php
          php -l modules/AiReception/Services/OpenAiIntakeClassifier.php
          php -l modules/AiReception/Services/MetaWebhook.php
          find modules/AiReception/ProvidersApi -name '*.php' -print0 | xargs -0 -n1 php -l
          find database/migrations/tenant -name '2026_11_28_*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Exceptions/Handler.php
          php -l app/Auth/StrictTokenGuard.php
          php -l app/Providers/AuthServiceProvider.php
      - name: Test slot planning (no network)
        run: php modules/AiReception/Tests/SlotPlannerTest.php
      - name: Test OpenAI fake HTTP (no network)
        run: php modules/AiReception/Tests/IntakeClassifierSmokeTest.php
      - name: Test Meta webhook fake signature (no network)
        run: php modules/AiReception/Tests/MetaWebhookMockTest.php
      - name: Test Tattoo availability fixtures (no database or network)
        run: php modules/AiReception/Tests/TattooAvailabilityTest.php
      - name: Test defensive validation (no network)
        run: php modules/AiReception/Tests/SecurityRegressionTest.php

      - name: Provider contracts without network
        run: php modules/AiReception/Tests/ProviderContractsTest.php

      - name: Audio validation without network
        run: php modules/AiReception/Tests/AudioContractsTest.php

      - name: V7 profile memory and lexical index unit checks
        run: |
          php native-lab/v7-unit-tests.php
          php native-lab/v71-state-tests.php

  gateway:
    name: Isolated gateway contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Test gateway without external providers
        run: node --test gateway/core.test.mjs gateway/http.test.mjs gateway/concurrency.test.mjs gateway/stress.test.mjs gateway/recovery.test.mjs gateway/provider-failures.test.mjs gateway/ollama.test.mjs gateway/ollama-gateway.test.mjs gateway/inference-jobs.test.mjs gateway/private-worker.test.mjs gateway/v71-recovery.test.mjs
